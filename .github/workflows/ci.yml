name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (full build, includes libvmaf and libx265)
        run: choco install ffmpeg-full -y --no-progress
      - name: Install Clip Buddy
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: End-to-end test (CPU encoder; CI machines have no GPU)
        env:
          CLIPBUDDY_TEST_ENCODER: x265
        run: python -m pytest -v
